services:
  skillsync-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillsync_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - TRUST_PROXY=true
      - MONGO_URI=mongodb://mongo:27017/skillsync_ai
      - JWT_SECRET=skillsync_ai_production_docker_compose_jwt_secret_minimum_64_characters_random_string_2026
      - JWT_EXPIRE=30d
      - CORS_ORIGIN=*
      - GEMINI_API_KEY=
      - GEMINI_MODEL=gemini-2.5-flash
      - GEMINI_MENTOR_MODEL=gemini-2.5-flash
      - INTERVIEW_LLM_TIMEOUT_MS=8000
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: skillsync_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
    driver: local
